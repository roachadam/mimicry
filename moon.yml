$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'library'
language: 'go'

# This project sits at the repo root, so its globs would also match the nested
# harness module. Exclude it; `go test ./...` already skips nested modules.
fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
    - '!internal/harness/**'
  testdata:
    - 'profiles/data/**'
    - '**/testdata/**'
    - '!internal/harness/**'
