$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'library'
language: 'go'

# This project sits at the repo root, so its globs would also match the nested
# harness and bench modules. Exclude them; `go test ./...` already skips
# nested modules.
fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
    - '!internal/harness/**'
    - '!internal/bench/**'
    - '!bindings/**'
  testdata:
    - 'profiles/data/**'
    # TestGenerated (internal/rpc/pb) compiles the schema.
    - 'proto/**'
    - '**/testdata/**'
    - '!internal/harness/**'
    - '!internal/bench/**'
    - '!bindings/**'

tasks:
  # Lints the protocol's schema (proto/) and generates its Go code into
  # internal/rpc/pb, with buf pinned here and protoc-gen-go at go.mod's
  # version (proto/buf.gen.yaml). TestGenerated fails while the checked-in
  # code differs, so CI needs no buf.
  proto:
    script: 'go run github.com/bufbuild/buf/cmd/buf@v1.75.0 lint proto && go run github.com/bufbuild/buf/cmd/buf@v1.75.0 generate --template proto/buf.gen.yaml'
    toolchain: 'system'
    options:
      cache: false
