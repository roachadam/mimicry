# Lint and tests. A pull request runs lint, the library's tests and the
# harness tests of the tiers its paths call for (.github/harness-shards.txt:
# core always; protocol and gen when it touches their paths, below); a push
# to main, the nightly run and a run by hand run every tier, main's too
# (the timing-heavy HTTP/3 edge and QUIC interop tests: their regressions
# show after the merge). release.yml calls it with full: true before a
# release (every tier, every profile). ci-ok is the one check to require:
# it passes when every job passed, or when a pull request touches only docs
# and the jobs were skipped. Each job stays under 15 minutes; the harness
# tests are split into shards (.github/scripts/harness-shard.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Test every supported profile (MIMICRY_PROFILES=all, :test-full), with longer timeouts.
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its running checks; other runs queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.full && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Go in .prototools, never a download go.mod asks for.
  GOTOOLCHAIN: local
  # Empty: each browser's newest profiles; all: every supported one.
  MIMICRY_PROFILES: ${{ inputs.full && 'all' || '' }}
  # Per go test run; a shard's setup takes about 2 of the job's 15 minutes,
  # so a hung test panics (listing what was running) before the job dies.
  TEST_TIMEOUT: ${{ inputs.full && '60m' || '12m' }}

jobs:
  # Whether a pull request touches more than docs (*.md, docs/, bench
  # reports): nothing in lint or the tests reads those. And which tiers of
  # the harness tests it runs, in how many shards: each tier's are about
  # 250 s of tests per shard (bash .github/scripts/harness-shard.sh <tiers>
  # plan <shards> prints the split), so a shard takes about 5 minutes with
  # its setup.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tiers: ${{ steps.filter.outputs.tiers }}
      shards: ${{ steps.filter.outputs.shards }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          # The HTTP/2, HTTP/3, QUIC and engine code, what the protocol
          # tier's tests replay it with (the scenario server, the trace
          # decoders, the profiles), and the Go and module versions.
          PROTOCOL_PATHS: '^(internal/(h2|h3|quic|qpack|hpack|engine|pool|dial|handshake|fingerprint|proxy)/|profile/|profiles/data/|internal/harness/e2e/|internal/harness/internal/(server|h2trace|quictrace)/|(internal/harness/)?go\.(mod|sum)$|go\.work(\.sum)?$|\.prototools$)'
          # The generators, what they read (captures, capture parsing) and
          # what they must reproduce (the profiles).
          GEN_PATHS: '^(internal/harness/cmd/(hellogen|h3gen|kindsgen)/|internal/harness/internal/capture/|internal/harness/testdata/captures/|profiles/data/|profile/)'
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            code=true tiers=core,protocol,gen,main shards=7
          else
            # A pull request checks out its merge commit: the first parent
            # is the base branch, so HEAD^1..HEAD is the pull request's
            # change.
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "$changed"
            files=$(echo "$changed" | grep -Ev '\.md$|^docs/|^internal/bench/reports/|^$' || true)
            code=false tiers=core shards=2
            [ -z "$files" ] || code=true
            if echo "$files" | grep -Eq "$PROTOCOL_PATHS"; then
              tiers+=,protocol shards=$((shards + 3))
            fi
            if echo "$files" | grep -Eq "$GEN_PATHS"; then
              tiers+=,gen shards=$((shards + 3))
            fi
          fi
          echo "code changed: $code; harness tiers: $tiers in $shards shards"
          {
            echo "code=$code"
            echo "tiers=$tiers"
            echo "shards=[$(seq "$shards" | paste -sd , -)]"
          } >>"$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # moon diffs against the base branch (origin/main), so it needs history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: lint
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: moon run :vet :lint
        run: moon run :vet :lint
      # The harness has Windows-only files (the capture host, the browser
      # sessions) that the host's lint never loads. golangci-lint is built
      # for the host at the version .moon/tasks/go.yml pins, then lints the
      # Windows build.
      - name: harness for Windows (build, vet, golangci-lint)
        working-directory: internal/harness
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
          pkg=$(grep -o 'github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v[0-9.]*' "$GITHUB_WORKSPACE/.moon/tasks/go.yml")
          GOBIN="$RUNNER_TEMP/bin" go install "$pkg"
          GOOS=windows "$RUNNER_TEMP/bin/golangci-lint" run

  test-root:
    name: test-root
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 75 || 15 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: test-root
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: go test -race ./... (library)
        run: go test -race -count=1 -timeout "$TEST_TIMEOUT" ./...
      # Never tested (its benchmarks need Docker); it must still build.
      - name: bench builds and vets
        working-directory: internal/bench
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          go vet ./...

  # The tiers changes picked, in its number of shards.
  test-harness:
    name: test-harness (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 75 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: test-harness
          # The shards share one cache; the first saves it.
          save: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      # The h3-v2 scenario's server (TestHTTP3EdgeMatchesBrowser, tier main).
      - if: contains(needs.changes.outputs.tiers, 'main')
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: contains(needs.changes.outputs.tiers, 'main')
        run: pip install aioquic==1.7.0
      - name: harness tests (${{ needs.changes.outputs.tiers }}), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          TIERS: ${{ needs.changes.outputs.tiers }}
        run: bash .github/scripts/harness-shard.sh "$TIERS" ${{ matrix.shard }} ${{ strategy.job-total }}

  # The check branch protection requires. A tier a pull request leaves out
  # is no job, only fewer shards, so a skipped job is a docs-only change.
  ci-ok:
    name: ci-ok
    needs: [changes, lint, test-root, test-harness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "code changed: ${CODE:-unknown}; job results: $RESULTS"
          for result in $RESULTS; do
            case $result in
            success) ;;
            skipped) [ "$CODE" = false ] || exit 1 ;;
            *) exit 1 ;;
            esac
          done
