# Lint, tests and govulncheck. A pull request runs the jobs its changed
# paths can affect (.github/scripts/ci-plan.sh: the library's change runs
# them all, the harness's or an SDK's fewer, docs nothing, any other path
# every job) and the harness tests of the tiers its paths call for
# (.github/harness-shards.txt: core always; protocol and gen when it touches
# their paths). A push to main that merged such a pull request adds what
# pull requests leave out: the main tier (the timing-heavy HTTP/3 edge and
# QUIC interop tests: their regressions show after the merge), the tiers
# that pull request left out, and the SDKs' macOS jobs. The nightly run, a
# run by hand and any other push run every job and tier. release.yml calls
# it with full: true before a release (every tier, every profile). ci-ok is
# the one check to require: it passes when every planned job passed and
# the others were skipped. Each job stays under 15 minutes; the harness
# tests are split into shards (.github/scripts/harness-shard.sh). test-node
# and test-python run the Node and Python SDKs' jobs (node.yml,
# python.yml). CodeQL is codeql.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Test every supported profile (MIMICRY_PROFILES=all, :test-full), with longer timeouts.
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its running checks. A push to main
# has a group of its own, so none is cancelled while queued (each adds what
# its pull request left out); other runs queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}-${{ inputs.full && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Go in .prototools, never a download go.mod asks for.
  GOTOOLCHAIN: local
  # Empty: each browser's newest profiles; all: every supported one.
  MIMICRY_PROFILES: ${{ inputs.full && 'all' || '' }}
  # Per go test run; a shard's setup takes about 2 of the job's 15 minutes,
  # so a hung test panics (listing what was running) before the job dies.
  TEST_TIMEOUT: ${{ inputs.full && '60m' || '12m' }}

jobs:
  # What the run tests (.github/scripts/ci-plan.sh): a pull request what its
  # changed paths can affect, by owner (the library, the harness, the bench,
  # each SDK; docs nothing; any other path every job), and the harness
  # tiers its paths call for. A push to main that squash-merged a pull
  # request whose ci-ok passed on the same tree (ci-push-proof.sh) adds
  # only what pull requests leave out: the main tier, the tiers that pull
  # request left out, the SDKs' macOS jobs. Every other run, and any push
  # that proof fails, runs every job and tier. The repository variable
  # CI_SELECTION=full makes every pull request and push run every job. A
  # pull request's shard takes about 3 minutes with its setup.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      tiers: ${{ steps.plan.outputs.tiers }}
      shards: ${{ steps.plan.outputs.shards }}
      node: ${{ steps.plan.outputs.node }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          CI_SELECTION: ${{ vars.CI_SELECTION }}
          FULL: ${{ inputs.full }}
          # The proof's API reads need no permission on a public repository.
          GH_TOKEN: ${{ github.token }}
        run: |
          mode='full'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            mode='pr'
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$FULL" != true ]; then
            if proof=$(bash .github/scripts/ci-push-proof.sh "$GITHUB_SHA"); then
              echo "pull request #$proof passed ci-ok on this tree"
              mode='push'
            else
              echo "$proof: a full run"
            fi
          fi
          changed=
          if [ "$mode" != full ]; then
            # A pull request checks out its merge commit, a push to main its
            # squash merge: the first parent is main, so HEAD^1..HEAD is the
            # pull request's change.
            changed=$(git diff --name-only HEAD^1 HEAD)
          fi
          bash .github/scripts/ci-plan.sh "$mode" <<<"$changed" >>"$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'lint')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # moon diffs against the base branch (origin/main), so it needs history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: lint
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: moon run :vet :lint
        run: moon run :vet :lint
      # The harness has Windows-only files (the capture host, the browser
      # sessions) that the host's lint never loads. golangci-lint is built
      # for the host at the version .moon/tasks/go.yml pins, then lints the
      # Windows build.
      - name: harness for Windows (build, vet, golangci-lint)
        working-directory: internal/harness
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
          pkg=$(grep -o 'github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v[0-9.]*' "$GITHUB_WORKSPACE/.moon/tasks/go.yml")
          GOBIN="$RUNNER_TEMP/bin" go install "$pkg"
          GOOS=windows "$RUNNER_TEMP/bin/golangci-lint" run

  test-root:
    name: test-root
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'test-root')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 75 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: test-root
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: go test -race ./... (library)
        run: go test -race -count=1 -timeout "$TEST_TIMEOUT" ./...
      # Never tested (its benchmarks need Docker); it must still build.
      - name: bench builds and vets
        working-directory: internal/bench
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          go vet ./...

  # Known vulnerabilities (the Go vulnerability database) in each module, its
  # dependencies and the Go standard library. It fails only on one the code
  # can reach (a call path to the vulnerable symbol) and lists the rest; the
  # nightly run catches one published after a merge. govulncheck is pinned
  # here and built with the pinned Go.
  vuln:
    name: vuln
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'vuln')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: vuln
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: govulncheck (library)
        run: go run "$GOVULNCHECK" ./...
      - name: govulncheck (harness)
        working-directory: internal/harness
        run: go run "$GOVULNCHECK" ./...
      - name: govulncheck (bench)
        working-directory: internal/bench
        env:
          GOWORK: 'off'
        run: go run "$GOVULNCHECK" ./...

  # The workflows and the setup action, audited by zizmor (template
  # injection, excessive permissions, unpinned or impostor action commits,
  # cache use in a release, ...): it fails on a finding of medium severity
  # or more. Its online audits read the actions' repositories with this
  # run's read-only token. Then the planner's cases
  # (.github/scripts/ci-plan-test.sh). A pull request runs it when it
  # changes a path outside the code's owners, .github/ among them.
  zizmor:
    name: zizmor
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'zizmor')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.32.0 --no-progress --min-severity medium --format github .github/workflows .github/actions
      - name: planner cases
        run: bash .github/scripts/ci-plan-test.sh

  # The tiers changes picked, in its number of shards.
  test-harness:
    name: test-harness (${{ matrix.shard }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'test-harness')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 75 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: test-harness
          # The shards share one cache; the first saves it.
          save: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      # The h3-v2 scenario's server (TestHTTP3EdgeMatchesBrowser, tier main).
      - if: contains(needs.changes.outputs.tiers, 'main')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - if: contains(needs.changes.outputs.tiers, 'main')
        run: pip install aioquic==1.7.0
      - name: harness tests (${{ needs.changes.outputs.tiers }}), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          TIERS: ${{ needs.changes.outputs.tiers }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: bash .github/scripts/harness-shard.sh "$TIERS" "$SHARD" "$SHARDS"

  # The Node SDK (bindings/node): its tests on Linux, macOS and Windows,
  # the byte-identical harness test, and its npm packages (node.yml); for a
  # pull request that changes only the harness, the harness test.
  test-node:
    name: test-node
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'test-node')
    uses: ./.github/workflows/node.yml
    with:
      scope: ${{ needs.changes.outputs.node }}

  # The Python SDK's tests (Linux, macOS, Windows), lint, the harness's
  # comparison of its requests with the Go client's, and its wheels
  # (python.yml); for a pull request that changes only the harness, the
  # Linux job with the comparison.
  test-python:
    name: test-python
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'test-python')
    uses: ./.github/workflows/python.yml
    with:
      scope: ${{ needs.changes.outputs.python }}

  # The check branch protection requires. It passes when changes succeeded,
  # every job it planned succeeded, and every other job was skipped.
  ci-ok:
    name: ci-ok
    needs: [changes, lint, test-root, vuln, zizmor, test-harness, test-node, test-python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          PLANNED: ${{ needs.changes.outputs.jobs }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "planned: ${PLANNED:-nothing}"
          failed=0
          while read -r job result; do
            want=skipped
            if [ "$job" = changes ] || jq -e --arg job "$job" 'index($job) != null' <<<"${PLANNED:-[]}" >/dev/null; then
              want=success
            fi
            echo "$job: $result (want $want)"
            [ "$result" = "$want" ] || failed=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          exit "$failed"
