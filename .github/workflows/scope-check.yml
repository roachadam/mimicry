# Temporary (removed before merge): runs the SDK workflows' harness and
# macos scopes on GitHub, which this pull request's own CI run (every job,
# scope all) does not reach.
name: Scope check

on:
  pull_request:

permissions:
  contents: read

jobs:
  node-harness:
    uses: ./.github/workflows/node.yml
    with:
      scope: harness
  node-macos:
    uses: ./.github/workflows/node.yml
    with:
      scope: macos
  python-harness:
    uses: ./.github/workflows/python.yml
    with:
      scope: harness
  python-macos:
    uses: ./.github/workflows/python.yml
    with:
      scope: macos
