name: Set up Go and moon
description: >-
  Installs the Go and moon pinned in .prototools (proto, through
  moonrepo/setup-toolchain) and restores the Go module and build caches.
  Only pushes to main save the caches; pull requests restore main's.

inputs:
  cache:
    description: The cache's name. Jobs that build different things (lint, race tests) keep separate caches.
    required: true
  save:
    description: Save the caches when the job ends ('true' on pushes to main only).
    default: 'false'

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      with:
        auto-install: true

    - id: paths
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"

    # The key changes on every commit to main, so main's newest caches are the
    # ones restored; restore-keys fall back to an older one.
    - if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          ~/.cache/golangci-lint
        key: go-${{ runner.os }}-${{ inputs.cache }}-${{ hashFiles('.prototools', '**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.cache }}-${{ hashFiles('.prototools', '**/go.sum') }}-
          go-${{ runner.os }}-${{ inputs.cache }}-

    - if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          ~/.cache/golangci-lint
        key: go-${{ runner.os }}-${{ inputs.cache }}-${{ hashFiles('.prototools', '**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.cache }}-${{ hashFiles('.prototools', '**/go.sum') }}-
          go-${{ runner.os }}-${{ inputs.cache }}-
