<text x="24.0" y="36.0" font-size="19.0" class="b">One request, and one new connection</text>
<text x="24.0" y="60.0" font-size="13.0" class="m">Go benchmarks against nginx, one client at a time. A warm connection: GET /json, the allocations the client makes per</text>
<text x="24.0" y="78.0" font-size="13.0" class="m">request. A new connection: GET /json on a new client, the full TLS (or QUIC) handshake included. mimicry has no HTTP/3</text>
<text x="24.0" y="96.0" font-size="13.0" class="m">row there: a new client starts on TCP and moves to HTTP/3 after the server&#39;s Alt-Svc, as Chrome does.</text>
