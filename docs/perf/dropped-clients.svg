<rect x="0.5" y="0.5" width="859" height="1022" rx="8" class="bg"/>
<text x="24.0" y="36.0" font-size="19.0" class="b">Clients dropped without closing them: lower is better</text>
<text x="24.0" y="60.0" font-size="13.0" class="m">100 routines, each building a new client (its library&#39;s constructor, new proxy credentials) every 10 requests and dropping</text>
<text x="24.0" y="78.0" font-size="13.0" class="m">the old one without closing it, for 10 s, GET 1 KB to nginx through the proxy. mimicry&#39;s pool closes what a dropped client</text>
<text x="24.0" y="96.0" font-size="13.0" class="m">left idle; the others keep it open until it times out.</text>
