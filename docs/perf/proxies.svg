<rect x="0.5" y="0.5" width="859" height="701" rx="8" class="bg"/>
<text x="24.0" y="36.0" font-size="19.0" class="b">100 clients, each through a proxy identity of its own</text>
<text x="24.0" y="60.0" font-size="13.0" class="m">100 clients of one library in one process, each with its own proxy credentials, each sending GET 1 KB to nginx one</text>
<text x="24.0" y="78.0" font-size="13.0" class="m">request at a time; the proxy delays everything it sends by 5 ms. Requests per second are nearly the same for every</text>
<text x="24.0" y="96.0" font-size="13.0" class="m">client (the proxy&#39;s delay sets the pace), so what differs is what each request and each client costs.</text>
