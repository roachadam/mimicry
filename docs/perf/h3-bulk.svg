<rect x="0.5" y="0.5" width="859" height="484" rx="8" class="bg"/>
<text x="24.0" y="36.0" font-size="19.0" class="b">Where mimicry is slower: HTTP/3 bulk downloads, many at once</text>
<text x="24.0" y="60.0" font-size="13.0" class="m">GET 100 KB from nginx over one HTTP/3 connection. mimicry asks for Chrome&#39;s 1 MB UDP receive buffer; the quic-go</text>
<text x="24.0" y="78.0" font-size="13.0" class="m">clients ask for 7 MB and force it (the client had CAP_NET_ADMIN). nginx serves the connection from one worker, which</text>
<text x="24.0" y="96.0" font-size="13.0" class="m">ran near a full core for every client at 64 at once. At 64 at once mimicry&#39;s socket dropped 447 datagrams on a full</text>
<text x="24.0" y="114.0" font-size="13.0" class="m">receive buffer; the others none.</text>
<rect x="24.0" y="132.0" width="12.0" height="12.0" class="mim"/>
