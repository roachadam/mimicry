<text x="125.0" y="142.0" font-size="12.0">tls-client</text>
<rect x="212.2" y="132.0" width="12.0" height="12.0" class="clk"/>
<text x="229.2" y="142.0" font-size="12.0">httpcloak</text>
<rect x="309.7" y="132.0" width="12.0" height="12.0" class="azr"/>
<text x="326.7" y="142.0" font-size="12.0">azuretls</text>
