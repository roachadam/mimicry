<rect x="0.5" y="0.5" width="859" height="681" rx="8" class="bg"/>
<text x="24.0" y="36.0" font-size="19.0" class="b">A new client per identity, the old one dropped without closing it</text>
<text x="24.0" y="60.0" font-size="13.0" class="m">100 routines, each building a new client (its library&#39;s constructor, new proxy credentials) every 10 requests and</text>
<text x="24.0" y="78.0" font-size="13.0" class="m">dropping the old one, as code that makes a client per proxy and never closes it does; GET 1 KB to nginx through the</text>
<text x="24.0" y="96.0" font-size="13.0" class="m">proxy for 10 s. mimicry&#39;s pool closes what a dropped client left idle; the others keep it open until it times out.</text>
