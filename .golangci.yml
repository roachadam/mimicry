version: "2"

# Runs per Go module (repo root and harness/) through the moon `lint` task; see
# .moon/tasks/go.yml. Based on an earlier project's set, with errcheck and revive's
# doc-comment rules on from the start since this is a new codebase.
linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  settings:
    gosec:
      excludes:
        # File paths are built by our own code and tests (capture names come
        # from parsed browser identities), never from untrusted input. Same
        # policy as our other projects.
        - G304
  enable:
    # --- guardrails ---
    - bodyclose       # HTTP response bodies are closed
    - unconvert       # no redundant type conversions
    - misspell        # common English misspellings
    - copyloopvar     # no leftover loop-var copies
    - makezero        # no append to a non-zero-length make()
    # --- bug catchers ---
    - nilerr          # don't return nil after checking err != nil
    - errorlint       # correct error wrapping (%w, errors.Is/As)
    - noctx           # network calls carry a context
    - unparam         # no unused function parameters
    - nilnil          # don't return (nil, nil)
    - wastedassign    # no assignments never read
    - contextcheck    # inherited context is propagated
    - gochecknoinits  # no init() functions
    - gosec           # security checks
    # --- style ---
    - gocritic        # broad diagnostic/style/perf checks
    - prealloc        # preallocate slices in loops
    - revive          # golint replacement, default rules incl. exported and package-comments
  exclusions:
    # internal/quic is a copy of golang.org/x/net/quic (decision 0027) in
    # upstream's style, which these linters fault in ~500 places (unchecked
    # Close errors, math/rand, %v on errors, unused test helpers, init
    # functions). Fixing them would make every upstream sync a merge, so the
    # copy is not linted; formatters still run on it. mimicry's own lines
    # there are checked by hand: see "Lint" in internal/quic/UPSTREAM.md.
    paths:
      - ^internal/quic/
    rules:
      # Tests close bodies through helpers and t.Cleanup, which bodyclose cannot
      # follow; product code is still checked.
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/roachadam/mimicry
