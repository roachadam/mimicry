$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'tool'
language: 'go'
dependsOn:
  - 'mimicry'

# The bench module is never in a go.work: a local one at the repo root would
# otherwise refuse it ("not one of the workspace modules").
env:
  GOWORK: 'off'

fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
    - '/**/*.go'
    - '/go.mod'
    - '/go.sum'
    - '!/internal/harness/**'

workspace:
  inheritedTasks:
    # Nothing to test: the module is benchmarks and the tools that drive
    # them, which need the Docker stacks. :vet and :lint still cover it.
    exclude: ['test', 'test-full']

tasks:
  # Layers 1-2: go test -bench in the client container, -count 10, then
  # benchstat; writes reports/micro-<date>.txt and -benchstat.txt.
  micro:
    description: 'Benchmark layers 1-2 (per request, per connection) with benchstat'
    command: 'bash scripts/bench.sh micro'
    toolchain: 'system'
    options:
      cache: false
      runInCI: false
      interactive: true
  # The default run: micro, then layers 3, 4 and 6 (the trimmed matrix;
  # BENCH_FULL=1 for every layer and the full matrix), then
  # reports/bench-<date>.md and .json. Settings are environment variables
  # (scripts/bench.sh, README.md).
  run:
    description: 'Benchmark the default run (micro, layers 3, 4, 6) and write the report'
    command: 'bash scripts/bench.sh run'
    toolchain: 'system'
    options:
      cache: false
      runInCI: false
      interactive: true
