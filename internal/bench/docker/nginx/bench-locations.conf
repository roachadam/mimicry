# The benchmark's endpoints (package site), shared by nginx's TLS servers.
# Every response carries the same headers as the Go server's: CORS for the
# page's cross-origin subresources, no caching, whether the TLS session was
# resumed (r or .), the protocol as the server saw it, and Alt-Svc on the
# port that offers HTTP/3 (empty, so absent, on the HTTP/1.1-only port).

location /bytes/ {
    default_type application/octet-stream;
    include /etc/nginx/bench-headers.conf;
}

location = /json {
    default_type application/json;
    include /etc/nginx/bench-headers.conf;
}

location = /echo {
    js_content bench.echo;
    include /etc/nginx/bench-headers.conf;
}

# The body is read whole into memory (client_body_buffer_size, nginx.conf)
# before bench.sink runs, which answers with its length.
location = /sink {
    js_content bench.sink;
    include /etc/nginx/bench-headers.conf;
}

location /page/ {
    include /etc/nginx/bench-headers.conf;
}
