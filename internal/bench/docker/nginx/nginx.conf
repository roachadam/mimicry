# nginx for the benchmark: the same endpoints, ports and headers as the Go
# server (cmd/server), from the files cmd/setup writes to /data/www.
#   8443  TLS: HTTP/2 and HTTP/1.1 (ALPN), HTTP/3 over UDP, Alt-Svc
#   8444  TLS: HTTP/1.1 only, no Alt-Svc
#   8080  plain HTTP: /_stats (the container's CPU time)
# worker_processes is set on the command line to the CPUs of the
# container's CPU set (compose.server.yml).
load_module modules/ngx_http_js_module.so;

worker_rlimit_nofile 200000;
error_log /dev/stderr warn;

events {
    worker_connections 65536;
}

http {
    js_path /etc/nginx/njs;
    js_import bench from bench.js;

    access_log off;
    server_tokens on;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Connections live as long as the benchmark needs them.
    keepalive_timeout 600s;
    keepalive_requests 10000000;
    http2_max_concurrent_streams 1000;
    http3_max_concurrent_streams 1000;

    ssl_certificate /data/ca/server.pem;
    ssl_certificate_key /data/ca/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    ssl_early_data on;
    quic_retry off;
    quic_gso on;

    client_max_body_size 32m;
    client_body_buffer_size 32m;

    # Nothing conditional: every GET returns its body.
    etag off;
    if_modified_since off;

    root /data/www;
    types {
        text/html html;
        text/css css;
        text/javascript js;
        image/webp webp;
        font/woff2 woff2;
        application/json json;
    }
    default_type application/octet-stream;

    server {
        listen 8443 ssl reuseport;
        listen 8443 quic reuseport;
        http2 on;
        http3 on;

        set $altsvc 'h3=":8443"; ma=86400';
        include /etc/nginx/bench-locations.conf;
    }

    server {
        listen 8444 ssl;
        http2 off;

        set $altsvc '';
        include /etc/nginx/bench-locations.conf;
    }

    server {
        listen 8080;

        location = /_stats {
            js_content bench.stats;
        }
    }
}
