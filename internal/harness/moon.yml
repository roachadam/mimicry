$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'tool'
language: 'go'
dependsOn:
  - 'mimicry'

# The harness compares mimicry's profiles against real browsers, so a change in
# the library must invalidate its cached test results too.
fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
    - '/**/*.go'
    - '/go.mod'
    - '/go.sum'
  # The captures, and the library's embedded profiles they are compared with.
  testdata:
    - 'testdata/**'
    - '/profiles/data/**'

tasks:
  # Launches the installed browsers (visible windows unless `-- -headless`)
  # against an in-process capture server and writes new captures to
  # testdata/captures. Never overwrites; delete a capture to retake it.
  capture:
    description: 'Capture the installed browsers into testdata/captures'
    command: 'go run ./cmd/capture'
    toolchain: 'system'
    options:
      cache: false
      runInCI: false
