$schema: 'https://moonrepo.dev/schemas/tasks.json'
# Every project with `language: 'go'` inherits these. Go comes from .prototools
# through proto's shim, so tasks run with the `system` toolchain.
inheritedBy:
  language: 'go'

fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
  # Data the tests read: embedded profiles, captures, fixtures. Without it
  # moon replays cached results after a profile or capture changes.
  testdata:
    - '**/testdata/**'

tasks:
  # The harness checks each browser's newest profile (decision 0035), or
  # those MIMICRY_PROFILES names; test-full checks every supported one.
  test:
    command: 'go test -race ./...'
    toolchain: 'system'
    inputs:
      - '@group(sources)'
      - '@group(testdata)'
      - '$MIMICRY_PROFILES'
  test-full:
    command: 'go test -race ./...'
    toolchain: 'system'
    env:
      MIMICRY_PROFILES: 'all'
    inputs:
      - '@group(sources)'
      - '@group(testdata)'
  vet:
    command: 'go vet ./...'
    toolchain: 'system'
    inputs:
      - '@group(sources)'
  # golangci-lint is pinned here and built with the pinned Go: a binary built
  # with an older Go cannot read the standard library's export data (Homebrew's
  # v2.13.2 fails on Go 1.27.3). It walks up to the repo-root .golangci.yml.
  # --allow-parallel-runners: moon lints both modules at once. Then gopls's
  # own analyzers (what an editor underlines; not all are in golangci-lint).
  lint:
    script: 'go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --allow-parallel-runners && bash $workspaceRoot/.moon/scripts/gopls-check.sh'
    toolchain: 'system'
    inputs:
      - '@group(sources)'
      - '/.golangci.yml'
      - '/.moon/scripts/gopls-check.sh'
