$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Change detection compares against main. In CI moon takes the base from the
# pull request (GITHUB_BASE_REF) and tries origin/<base> first, then this
# branch the same way, so 'main' works there too: the lint job checks out the
# full history (.github/workflows/ci.yml).
vcs:
  defaultBranch: 'main'

projects:
  # The library module lives at the repo root so users import
  # github.com/roachadam/mimicry directly.
  mimicry: '.'
  harness: 'internal/harness'
  # Benchmarks against other clients; never part of :test (README there).
  bench: 'internal/bench'
