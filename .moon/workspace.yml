$schema: 'https://moonrepo.dev/schemas/workspace.json'

# The repo is local-only for now, so change detection compares against the
# local branch. Switch to 'origin/main' once it has a remote and CI.
vcs:
  defaultBranch: 'main'

projects:
  # The library module lives at the repo root so users import
  # github.com/roachadam/mimicry directly.
  mimicry: '.'
  harness: 'internal/harness'
  # Benchmarks against other clients; never part of :test (README there).
  bench: 'internal/bench'
